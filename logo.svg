<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Quiz Neon Blue/Teal Gradient -->
    <linearGradient id="neonTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Quiz Yellow/Gold Gradient -->
    <linearGradient id="goldSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Emerald Accent Gradient -->
    <linearGradient id="emeraldSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Crimson Accent Gradient -->
    <linearGradient id="redSquare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="cleanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- PURE 4-SQUARE QUIZ GRID (TIGHTLY PACKED, NO TEXT, NO BACKGROUND) -->
  <g id="tightQuizGrid" transform="translate(16, 16)">
    <!-- Katak A (Top Left) -->
    <rect x="90" y="90" width="140" height="140" rx="28" 
          fill="url(#emeraldSquare)" stroke="#ffffff" stroke-width="5" filter="url(#cleanGlow)"/>
    <text x="160" y="180" text-anchor="middle" fill="#ffffff" font-family="Impact, Arial Black, sans-serif" font-size="64">A</text>

    <!-- Katak B (Top Right - Beks) -->
    <rect x="250" y="90" width="140" height="140" rx="28" 
          fill="url(#goldSquare)" stroke="#ffffff" stroke-width="5" filter="url(#cleanGlow)"/>
    <text x="320" y="180" text-anchor="middle" fill="#ffffff" font-family="Impact, Arial Black, sans-serif" font-size="64">B</text>

    <!-- Katak C (Bottom Left) -->
    <rect x="90" y="250" width="140" height="140" rx="28" 
          fill="url(#redSquare)" stroke="#ffffff" stroke-width="5" filter="url(#cleanGlow)"/>
    <text x="160" y="340" text-anchor="middle" fill="#ffffff" font-family="Impact, Arial Black, sans-serif" font-size="64">C</text>

    <!-- Katak ? (Bottom Right) -->
    <rect x="250" y="250" width="140" height="140" rx="28" 
          fill="url(#neonTeal)" stroke="#ffffff" stroke-width="5" filter="url(#cleanGlow)"/>
    <text x="320" y="342" text-anchor="middle" fill="#ffffff" font-family="Impact, Arial Black, sans-serif" font-size="70" font-weight="900">?</text>
  </g>
</svg>
